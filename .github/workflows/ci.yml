name: CI

# Vérifications automatiques à chaque push et à la demande.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  secrets-scan:
    name: Scan des secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    name: Validation docker-compose.yml
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci-dummy
      POSTGRES_PASSWORD: ci-dummy
      RABBITMQ_PASSWORD: ci-dummy
      KEYCLOAK_EXTERNAL_URL: https://auth.example.com
      KEYCLOAK_BACKEND_CLIENT_SECRET: ci-dummy
      KEYCLOAK_ADMIN_PASSWORD: ci-dummy
      KEYCLOAK_DB_PASSWORD: ci-dummy
      FRONTEND_DOMAIN: app.example.com
      KEYCLOAK_DOMAIN: auth.example.com
      LICENSE_PUBLIC_KEY: ci-dummy
      CF_DNS_API_TOKEN: ci-dummy
      ORG_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp test

  search-service:
    name: Search-service (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      KEYCLOAK_EXTERNAL_URL: https://auth.example.com
      KEYCLOAK_REALM: hscode-realm
      KEYCLOAK_FRONTEND_CLIENT: frontend-client
      API_URL: /api
      MARKET_VERSION: DZ
      BETA_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Tests (Karma, ChromeHeadless)
        continue-on-error: true
        run: npx ng test --watch=false --browsers=ChromeHeadless
