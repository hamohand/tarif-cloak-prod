server:
  port: 8082
  error:
    include-message: always

spring:
  application:
    name: search-service

  # Base de données PostgreSQL
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tarif}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

  # Redis Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Cache configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 heure en millisecondes

  # Security OAuth2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tarif}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/tarif/protocol/openid-connect/certs}

# Configuration OpenFeign
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
  circuitbreaker:
    enabled: true

# Backend service URL
backend:
  url: ${BACKEND_URL:http://localhost:8081}

# Configuration IA
ai:
  http:
    connect-timeout-ms: ${AI_HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_HTTP_READ_TIMEOUT_MS:180000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    price-input-per-million: ${OPENAI_PRICE_INPUT:0.40}
    price-output-per-million: ${OPENAI_PRICE_OUTPUT:1.60}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5-20250929}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    price-input-per-million: ${ANTHROPIC_PRICE_INPUT:3.00}
    price-output-per-million: ${ANTHROPIC_PRICE_OUTPUT:15.00}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    num-ctx: ${OLLAMA_NUM_CTX:16384}
    keep-alive: ${OLLAMA_KEEP_ALIVE:24h}
    json-mode: ${OLLAMA_JSON_MODE:true}
  # Provider actif pour les requêtes standard ET batch (ollama par défaut sur dz-localization)
  provider: ${AI_PROVIDER:ollama}

  # Configuration des Batches (file locale Ollama ou API cloud)
  batch:
    enabled: ${AI_BATCH_ENABLED:true}
    max-requests-per-batch: ${AI_BATCH_MAX_REQUESTS:1000}
    local-max-requests: ${AI_BATCH_LOCAL_MAX_REQUESTS:300}
    local-concurrency: ${AI_BATCH_LOCAL_CONCURRENCY:1}
    local-level: ${AI_BATCH_LOCAL_LEVEL:POSITIONS10}
    local-ttl-hours: ${AI_BATCH_LOCAL_TTL_HOURS:168}

# RabbitMQ Exchanges et Queues
messaging:
  exchange:
    search: search-exchange
  queue:
    search-completed: search-completed-queue
  routing-key:
    search-completed: search.completed

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      backendService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      backendService:
        maxAttempts: 3
        waitDuration: 1s

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hscode.enclume-numerique.com,https://www.hscode.enclume-numerique.com,http://localhost:4200}

guest:
  trial:
    max-per-ip-per-day: ${GUEST_TRIAL_MAX_PER_IP_PER_DAY:1}
    global-daily-limit: ${GUEST_TRIAL_GLOBAL_DAILY_LIMIT:100}

# Logging
logging:
  level:
    com.tarif.search: INFO
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.amqp: INFO
