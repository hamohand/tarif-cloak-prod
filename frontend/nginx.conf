server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html/;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /edition.json {
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
