server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  # Résolveur DNS interne Docker (évite tout blocage si un conteneur redémarre)
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html/;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /edition.json {
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Routes Recherche & Batch IA -> search-service:8082 (sans le préfixe /api)
  location ~ ^/api/(recherche|batch-search)(/.*)?$ {
    set $search_upstream http://search-service:8082;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $search_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Toutes les autres routes API -> backend:8081 (sans le préfixe /api)
  location /api/ {
    set $backend_upstream http://backend:8081;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
