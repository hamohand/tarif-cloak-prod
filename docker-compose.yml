# ===============================================================
# DOCKER COMPOSE - INSTALLATION LOCALE SUR ORDINATEUR (DZ-LOCALIZATION)
# ===============================================================
# Exécution 100 % locale sur PC Windows / Mac / Linux (Docker Desktop) :
# - Accès direct via http://localhost:8088 (sans nom de domaine ni certificat HTTPS)
# - Nginx (conteneur frontend) sert l'interface Angular et proxifie /api/*
# - Keycloak local sur http://localhost:8085 + PostgreSQL + Redis + RabbitMQ
# - IA 100 % locale via Ollama sur l'ordinateur hôte (modèle qwen2.5:7b par défaut)
# - Licence hors-ligne signée Ed25519 + comptes collaborateurs locaux sans SMTP
# ===============================================================

services:

  # ===============================================================
  # BASE DE DONNÉES POSTGRESQL APPLICATION
  # ===============================================================
  app-db:
    image: "postgres:${POSTGRES_IMAGE_TAG:-16}"
    container_name: "${PROJECT_NAME:-tci-local}-app-db"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hscode-app-db}"
      POSTGRES_USER: "${POSTGRES_USER:-muhend}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - app-database-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER:-muhend}", "-d", "${POSTGRES_DB:-hscode-app-db}" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # BASE DE DONNÉES POSTGRESQL KEYCLOAK
  # ===============================================================
  keycloak-db:
    image: "postgres:${POSTGRES_IMAGE_TAG:-16}"
    container_name: "${PROJECT_NAME:-tci-local}-keycloak-db"
    environment:
      POSTGRES_DB: "${KEYCLOAK_DB:-keycloak}"
      POSTGRES_USER: "${KEYCLOAK_DB_USER:-keycloak}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    volumes:
      - keycloak-database-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-U", "${KEYCLOAK_DB_USER:-keycloak}", "-d", "${KEYCLOAK_DB:-keycloak}" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # KEYCLOAK - AUTHENTIFICATION LOCALE (http://localhost:8085)
  # ===============================================================
  keycloak:
    image: "quay.io/keycloak/keycloak:${KEYCLOAK_IMAGE_TAG:-22.0.1}"
    container_name: "${PROJECT_NAME:-tci-local}-keycloak"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8085}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER:-keycloak}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USER:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_URL: "${KEYCLOAK_EXTERNAL_URL:-http://localhost:8085}"
      KC_HOSTNAME_ADMIN_URL: "${KEYCLOAK_EXTERNAL_URL:-http://localhost:8085}"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # RABBITMQ & REDIS LOCAUX
  # ===============================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: "${PROJECT_NAME:-tci-local}-rabbitmq"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: "${PROJECT_NAME:-tci-local}-redis"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # OLLAMA CONTENEURISÉ OPTIONNEL (LINUX + GPU NVIDIA UNIQUEMENT)
  # Sur Windows et Mac, installer simplement Ollama sur l'ordinateur hôte :
  # Docker Desktop le joint automatiquement via http://host.docker.internal:11434
  # ===============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: "${PROJECT_NAME:-tci-local}-ollama"
    profiles: ["linux-gpu"]
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # BACKEND API (TARIFS DZ/UE + LICENCE ED25519 LOCALE)
  # ===============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: "${PROJECT_NAME:-tci-local}-backend"
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_PORT: "8081"
      # Base de données locale
      DB_SERVICE_NAME: "app-db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-hscode-app-db}"
      POSTGRES_USER: "${POSTGRES_USER:-muhend}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Keycloak local
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-hscode-realm}"
      KEYCLOAK_BACKEND_CLIENT: "${KEYCLOAK_BACKEND_CLIENT:-backend-client}"
      KEYCLOAK_BACKEND_CLIENT_SECRET: "${KEYCLOAK_BACKEND_CLIENT_SECRET}"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_EXTERNAL_URL: "${KEYCLOAK_EXTERNAL_URL:-http://localhost:8085}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:4200}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8088}"
      SPRINGDOC_SWAGGER_UI_URL: "${FRONTEND_URL:-http://localhost:8088}/api/v3/api-docs"
      # RabbitMQ
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER:-admin}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      # SMTP coupé par défaut (zéro envoi d'email hors de l'ordinateur)
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-25}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_AUTH: "${SMTP_AUTH:-false}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
      SMTP_STARTTLS_REQUIRED: "${SMTP_STARTTLS_REQUIRED:-false}"
      # Bootstrap automatique du compte organisation au 1er lancement
      BOOTSTRAP_ENABLED: "${BOOTSTRAP_ENABLED:-true}"
      ORG_NAME: "${ORG_NAME:-Entreprise Locale DZ}"
      ORG_EMAIL: "${ORG_EMAIL:-admin@local.dz}"
      ORG_PASSWORD: "${ORG_PASSWORD}"
      ORG_ADDRESS: "${ORG_ADDRESS:-Alger, Algérie}"
      ORG_PHONE: "${ORG_PHONE:-+21321000000}"
      ORG_ACTIVITY_DOMAIN: "${ORG_ACTIVITY_DOMAIN:-Commerce International}"
      # Licence Ed25519 hors-ligne
      BOX_ID: "${BOX_ID:-box-local-dz}"
      LICENSE_PUBLIC_KEY: "${LICENSE_PUBLIC_KEY}"
      LICENSE_TOKEN: "${LICENSE_TOKEN:-}"
      LICENSE_FILE: "/data/license/license.jwt"
      LICENSE_HEARTBEAT_URL: "${LICENSE_HEARTBEAT_URL:-}"
      LICENSE_HEARTBEAT_INTERVAL_MS: "${LICENSE_HEARTBEAT_INTERVAL_MS:-43200000}"
      OFFLINE_GRACE_DAYS: "${OFFLINE_GRACE_DAYS:-30}"
      # Ollama sur l'ordinateur hôte
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - license-data:/data/license
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # SEARCH SERVICE - IA 100 % LOCALE VIA OLLAMA
  # ===============================================================
  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: "${PROJECT_NAME:-tci-local}-search-service"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: "jdbc:postgresql://app-db:5432/${POSTGRES_DB:-hscode-app-db}"
      DATABASE_USERNAME: "${POSTGRES_USER:-muhend}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER:-admin}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      BACKEND_URL: "http://backend:8081"
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_EXTERNAL_URL:-http://localhost:8085}/realms/${KEYCLOAK_REALM:-hscode-realm}"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/${KEYCLOAK_REALM:-hscode-realm}/protocol/openid-connect/certs"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:4200}"
      # Configuration IA locale Ollama (qwen2.5:7b léger par défaut)
      AI_PROVIDER: "${BOX_AI_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-16384}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-24h}"
      OLLAMA_JSON_MODE: "${OLLAMA_JSON_MODE:-true}"
      AI_HTTP_READ_TIMEOUT_MS: "${AI_HTTP_READ_TIMEOUT_MS:-180000}"
      AI_BATCH_LOCAL_MAX_REQUESTS: "${AI_BATCH_LOCAL_MAX_REQUESTS:-300}"
      AI_BATCH_LOCAL_CONCURRENCY: "${AI_BATCH_LOCAL_CONCURRENCY:-1}"
      AI_BATCH_LOCAL_LEVEL: "${AI_BATCH_LOCAL_LEVEL:-POSITIONS10}"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # FRONTEND ANGULAR + REVERSE PROXY NGINX (http://localhost:8088)
  # ===============================================================
  frontend:
    build:
      context: ./frontend
      args:
        KEYCLOAK_EXTERNAL_URL: "${KEYCLOAK_EXTERNAL_URL:-http://localhost:8085}"
        KEYCLOAK_REALM: "${KEYCLOAK_REALM:-hscode-realm}"
        KEYCLOAK_FRONTEND_CLIENT: "${KEYCLOAK_FRONTEND_CLIENT:-frontend-client}"
        API_URL: "/api"
        MARKET_VERSION: "DZ"
        APP_EDITION: "${APP_EDITION:-dz-localization}"
        NGINX_CONF: nginx.conf
    container_name: "${PROJECT_NAME:-tci-local}-frontend"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
    environment:
      APP_EDITION: "${APP_EDITION:-dz-localization}"
    depends_on:
      - backend
      - search-service
    restart: unless-stopped
    networks:
      - default

  # ===============================================================
  # TUNNEL DE SUPPORT TEMPORAIRE (COUPÉ PAR DÉFAUT)
  # ===============================================================
  support-tunnel:
    image: tailscale/tailscale:latest
    container_name: "${PROJECT_NAME:-tci-local}-support-tunnel"
    profiles: ["support"]
    hostname: "${BOX_ID:-box-local-dz}"
    environment:
      TS_AUTHKEY: "${TAILSCALE_AUTHKEY:-}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: "--ssh"
    volumes:
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

volumes:
  app-database-data:
  keycloak-database-data:
  rabbitmq-data:
  redis-data:
  license-data:
  ollama-models:
  tailscale-state:

networks:
  default:
    name: "${PROJECT_NAME:-tci-local}-net"
